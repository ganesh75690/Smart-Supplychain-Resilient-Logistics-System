version: '3.8'

services:
  # Main API service
  api:
    build: .
    container_name: supply-chain-api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql://postgres:password@postgres:5432/supply_chain_db
      - MONGODB_URL=mongodb://mongo:27017/supply_chain_realtime
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=demo-secret-key-change-in-production
      - DEBUG=True
      - FIREBASE_PROJECT_ID=supply-chain-demo-5d7cd
      - FIREBASE_SERVICE_ACCOUNT_PATH=./firebase_service_account.json
      - FIREBASE_DATABASE_URL=https://supply-chain-demo-5d7cd-default-rtdb.firebaseio.com
    depends_on:
      - postgres
      - mongo
      - redis
    volumes:
      - ./firebase_service_account.json:/app/firebase_service_account.json:ro
      - ./logs:/app/logs
    networks:
      - supply-chain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: supply-chain-postgres
    environment:
      - POSTGRES_DB=supply_chain_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - supply-chain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB database
  mongo:
    image: mongo:6.0
    container_name: supply-chain-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - supply-chain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: supply-chain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - supply-chain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: supply-chain-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - supply-chain-network
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  supply-chain-network:
    driver: bridge
