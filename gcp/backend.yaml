# Google Cloud App Engine configuration for Backend
runtime: python311

# Instance class and scaling
instance_class: F4_1G
automatic_scaling:
  min_instances: 1
  max_instances: 5
  cpu_utilization:
    target_utilization: 0.75

# Environment variables (update with your actual values)
env_variables:
  PYTHON_VERSION: 3.11
  DATABASE_URL: postgresql://postgres:YOUR_PASSWORD@YOUR_CLOUD_SQL_IP:5432/supply_chain
  MONGODB_URL: mongodb://YOUR_MONGODB_ATLAS_CONNECTION_STRING
  REDIS_URL: redis://YOUR_REDIS_IP:6379/0
  JWT_SECRET_KEY: YOUR_SUPER_SECRET_KEY_CHANGE_IN_PRODUCTION
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  
  # Firebase Configuration
  FIREBASE_PROJECT_ID: supply-chain-demo-5d7cd
  FIREBASE_SERVICE_ACCOUNT_PATH: ./firebase_service_account.json
  FIREBASE_DATABASE_URL: https://supply-chain-demo-5d7cd-default-rtdb.firebaseio.com
  FIREBASE_WEB_API_KEY: AIzaSyDemoKeyForWebClient
  FIREBASE_API_KEY: AIzaSyDemoKeyForWebClient
  
  # Google Services (update with real keys)
  GOOGLE_VERTEX_AI_API_KEY: YOUR_VERTEX_AI_KEY
  GOOGLE_GEMINI_API_KEY: YOUR_GEMINI_KEY
  GOOGLE_MAPS_API_KEY: YOUR_MAPS_API_KEY
  BIGQUERY_API_KEY: YOUR_BIGQUERY_KEY
  
  # App Configuration
  APP_NAME: Smart Supply Chain Platform
  APP_VERSION: 1.0.0
  DEBUG: false
  CORS_ORIGINS: '["https://YOUR_PROJECT_ID.appspot.com", "https://www.YOUR_PROJECT_ID.appspot.com"]'
  
  # Redis Configuration
  REDIS_URL: redis://YOUR_REDIS_IP:6379/0
  
  # Celery Configuration
  CELERY_BROKER_URL: redis://YOUR_REDIS_IP:6379/0
  CELERY_RESULT_BACKEND: redis://YOUR_REDIS_IP:6379/0

# Health check
readiness_check:
  path: /health
  check_interval_sec: 5
  timeout_sec: 4
  failure_threshold: 2
  success_threshold: 2

# Liveness check
liveness_check:
  path: /health
  initial_delay_sec: 300
  check_interval_sec: 60

# Security
secure: always

# Runtime configuration
runtime_config:
  python_version: 3.11

# Network settings
network:
  forwarded_referrer_allowed: true
  session_affinity: true
