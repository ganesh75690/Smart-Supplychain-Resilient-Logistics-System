# Google Cloud Build configuration for CI/CD Pipeline
steps:
  # Install dependencies and build frontend
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
    dir: '.'
    
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: '.'

  # Build backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/supply-chain-backend:$COMMIT_SHA', '-f', 'backend/Dockerfile', './backend']
    
  # Push backend image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/supply-chain-backend:$COMMIT_SHA']

  # Deploy frontend to App Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'app'
      - 'deploy'
      - '--quiet'
      - '--version=$COMMIT_SHA'
      - '--project=$PROJECT_ID'
      - 'gcp/app.yaml'

  # Deploy backend to App Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'app'
      - 'deploy'
      - '--quiet'
      - '--version=$COMMIT_SHA'
      - '--project=$PROJECT_ID'
      - 'gcp/backend.yaml'

# Images to store
images:
  - 'gcr.io/$PROJECT_ID/supply-chain-backend:$COMMIT_SHA'

# Build timeout
timeout: '1200s'

# Substitutions
substitutions:
  _NODE_VERSION: '20'
  _PYTHON_VERSION: '311'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

# Tags for build
tags:
  - 'supply-chain-frontend'
  - 'supply-chain-backend'
  - 'v1.0.0'
